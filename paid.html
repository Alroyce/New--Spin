<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paid - LR Booking</title>


    <style>
        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(135deg,
                    #0688df 0%,
                    #457ebe 45%,
                    #c0abab 100%);

            color: #263238;

            font-size: 14px;
        }


        /* =====================================================
           FORM - FULL SCREEN WIDTH
        ===================================================== */

        form {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            padding: 8px;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .container {
            width: 100%;

            background:
                linear-gradient(90deg,
                    #de5009,
                    #245e80);

            border-radius: 7px;

            margin-bottom: 8px;

            box-shadow:
                0 3px 8px rgba(20, 60, 90, 0.20);
        }


        .container ul {
            list-style: none;

            display: flex;
            flex-wrap: wrap;

            padding: 0;
            margin: 0;
        }


        .container li {
            margin: 0;
        }


        .container a {
            display: block;

            padding: 10px 17px;

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            transition: 0.2s;
        }


        .container a:hover {
            background:
                rgba(23, 41, 206, 0.14);

            border-radius: 6px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            width: 100%;

            background:
                linear-gradient(135deg,
                    #ffffff,
                    #edf5fa);

            border:
                1px solid #c8d7e3;

            border-radius: 7px;

            padding: 10px 15px;

            margin-bottom: 8px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 8px rgba(45, 70, 90, 0.09);
        }


        .header h1 {
            margin: 0;

            color: #1769aa;

            font-size: 24px;
        }


        .meta-info {
            display: flex;
            gap: 25px;
        }


        .meta-info p {
            margin: 0;

            font-size: 13px;

            font-weight: bold;
        }


        .meta-info span {
            color: #1769aa;
        }


        /* =====================================================
           MAIN LAYOUT
        ===================================================== */

        .main-layout {
            width: 100%;

            display: grid;

            grid-template-columns:
                minmax(0, 1.45fr) minmax(360px, 0.75fr);

            gap: 9px;

            align-items: start;
        }


        /* =====================================================
           LEFT SIDE
        ===================================================== */

        .left-side {
            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 8px;

            min-width: 0;
        }


        /* =====================================================
           COMMON BOX
        ===================================================== */

        .lrform,
        .form-section,
        .article-section,
        .details-wrapper,
        .delivery-box {

            background:
                linear-gradient(135deg,
                    #ffffff,
                    #f3f8fb);

            border:
                1px solid #c8d7e3;

            border-radius: 8px;

            padding: 10px;

            box-shadow:
                0 2px 7px rgba(42, 72, 96, 0.08);
        }


        /* =====================================================
           FROM / TO
        ===================================================== */

        .lrform {
            width: 100%;
            margin: 0;
        }


        .form1 {
            width: 100%;

            display: grid;

            grid-template-columns:
                40px minmax(0, 1fr) 25px minmax(0, 1fr);

            gap: 7px;

            align-items: center;
        }


        /* =====================================================
           LABEL
        ===================================================== */

        label {
            font-weight: bold;

            color: #405568;

            font-size: 13px;
        }


        /* =====================================================
           INPUT / SELECT
        ===================================================== */

        input,
        select {
            width: 100%;

            height: 32px;

            padding: 5px 9px;

            border:
                1px solid #c5d2dc;

            border-radius: 5px;

            background: #f1f7fb;

            color: #263238;

            font-size: 13px;

            outline: none;

            transition: 0.2s;
        }


        input:hover,
        select:hover {
            background: #e9f3f8;

            border-color: #b3c6d5;
        }


        input:focus,
        select:focus {
            background: #ffffff;

            border-color: #3f8fca;

            box-shadow:
                0 0 0 2px rgba(63, 143, 202, 0.12);
        }


        /* =====================================================
           READONLY INPUTS
        ===================================================== */

        input[readonly] {
            cursor: default;

            background: #e8eef3;

            color: #405568;

            font-weight: bold;
        }


        input[readonly]:hover {
            background: #e8eef3;

            border-color: #c5d2dc;
        }

        input[type="number"]::-webkit-inner-spin-button,

        input[type="number"] {
            -moz-appearance: textfield;

        /* =====================================================
           CONSIGNOR + CONSIGNEE
        ===================================================== */

        .consignor-consignee {
            width: 100%;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            align-items: stretch;
        }


        .form-section {
            min-width: 0;
        }


        .form-section>label {
            display: block;

            color: #1769aa;

            font-size: 15px;

            margin-bottom: 7px;

            padding-bottom: 6px;

            border-bottom:
                1px solid #d6e1e9;
        }


        .inline-fields {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 6px;

            margin-bottom: 6px;
        }


        .input-box {
            margin-bottom: 6px;
        }


        /* =====================================================
           BILLING SUMMARY
        ===================================================== */

        .charges-section {
            width: 100%;

            background:
                linear-gradient(145deg,
                    #102a43,
                    #174568);

            border:
                1px solid #0d2c43;

            border-radius: 8px;

            padding: 14px;

            color: white;

            box-shadow:
                0 4px 14px rgba(16, 42, 67, 0.22);

            position: sticky;

            top: 8px;
        }


        /* =====================================================
           BILLING HEADER
        ===================================================== */

        .charges-section h3 {
            margin:
                0 0 12px 0;

            padding:
                0 0 10px 0;

            color: #ffffff;

            font-size: 18px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.17);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .charges-section h3::after {
            content: "₹";
